[project]
name = "routelog-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.16",
    "djangorestframework==3.17.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "routelog.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
